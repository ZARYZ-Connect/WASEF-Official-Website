# Nginx config for the React SPA frontend container
# Proxies /api/* and /admin/* to the Django backend

# ── HTTP → HTTPS redirect (enable after SSL cert is provisioned) ──
# Uncomment this block when your domain + SSL cert are ready:
#
# server {
#     listen 80;
#     server_name wasefmanufacturing.com www.wasefmanufacturing.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Performance: fast file serving ─────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;

    # ── Video files — progressive streaming with byte-range ────
    location ~* \.(mp4|webm|ogg)$ {
        expires         7d;
        add_header      Cache-Control "public, max-age=604800";
        add_header      Accept-Ranges bytes;
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
        try_files       $uri =404;
    }

    # ── Static assets (long cache) ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # ── API proxy → Django backend ─────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Django admin ───────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django static/media files ──────────────────────────────
    location /static/ {
        proxy_pass http://backend:8000;
    }
    location /media/ {
        proxy_pass http://backend:8000;
    }

    # ── React SPA — all other routes ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA entrypoint — no-cache to guarantee browser loads new asset hashes immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Security headers for general resources
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
