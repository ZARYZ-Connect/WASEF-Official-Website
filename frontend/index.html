      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap');

      body {
        margin: 0;
        background: #000;
      }

      #mandala-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
      }

      #mandala-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      #mandala-preloader * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #mandala-preloader .mandala-wrap {
        position: relative;
        width: min(520px, 96vw);
        aspect-ratio: 1 / 1.05;
      }

      /* Base logo image */
      #mandala-preloader .logo-base {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        position: absolute;
        inset: 0;
        z-index: 2;
        animation: preloader-float 6s ease-in-out infinite;
      }
      @keyframes preloader-float {
        0%,100% { transform: translateY(0); }
        50%      { transform: translateY(-7px); }
      }

      /* Per-element spinning canvas overlay */
      #mandala-preloader .el-canvas {
        position: absolute;
        border-radius: 50%;
        z-index: 5;
        pointer-events: none;
        mix-blend-mode: screen;
        transform-origin: center center;
      }

      /* Each medallion rotates at its own speed */
      #mandala-preloader #c-akash   {
        left: 50%; top: 10%;
        transform: translate(-50%, -50%);
        animation: preloader-spin-cw 12s linear infinite;
      }
      #mandala-preloader #c-vayu    {
        left: 13%; top: 36%;
        transform: translate(-50%, -50%);
        animation: preloader-spin-ccw 9s linear infinite;
      }
      #mandala-preloader #c-agni    {
        left: 87%; top: 36%;
        transform: translate(-50%, -50%);
        animation: preloader-spin-cw 7s linear infinite;
      }
      #mandala-preloader #c-jal     {
        left: 13%; top: 63%;
        transform: translate(-50%, -50%);
        animation: preloader-spin-ccw 11s linear infinite;
      }
      #mandala-preloader #c-prithvi {
        left: 87%; top: 63%;
        transform: translate(-50%, -50%);
        animation: preloader-spin-cw 14s linear infinite;
      }

      @keyframes preloader-spin-cw  { from { transform: translate(-50%, -50%) rotate(0deg); }   to { transform: translate(-50%, -50%) rotate(360deg); } }
      @keyframes preloader-spin-ccw { from { transform: translate(-50%, -50%) rotate(0deg); }   to { transform: translate(-50%, -50%) rotate(-360deg); } }

      /* Spinning ring borders */
      #mandala-preloader .ring {
        position: absolute;
        border-radius: 50%;
        z-index: 6;
        pointer-events: none;
        transform: translate(-50%, -50%);
        border: 2px solid transparent;
      }
      #mandala-preloader .ring-cw  { animation: preloader-ring-cw-anim  3s linear infinite; }
      #mandala-preloader .ring-ccw { animation: preloader-ring-ccw-anim 2s linear infinite; }
      @keyframes preloader-ring-cw-anim  { to { transform: translate(-50%,-50%) rotate(360deg); } }
      @keyframes preloader-ring-ccw-anim { to { transform: translate(-50%,-50%) rotate(-360deg); } }

      /* Glow behind each medallion */
      #mandala-preloader .medallion-glow {
        position: absolute;
        border-radius: 50%;
        z-index: 1;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: preloader-med-pulse 2.5s ease-in-out infinite;
      }
      @keyframes preloader-med-pulse {
        0%,100% { opacity:0.25; transform:translate(-50%,-50%) scale(1); }
        50%      { opacity:0.7;  transform:translate(-50%,-50%) scale(1.18); }
      }

      /* Globe expanding rings */
      #mandala-preloader .globe-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(212,175,55,0.2);
        top: 48%; left: 50%;
        transform: translate(-50%,-50%);
        z-index: 3;
        pointer-events: none;
        animation: preloader-globe-expand 4s ease-out infinite;
      }
      #mandala-preloader .globe-ring:nth-child(2) { animation-delay: 1.3s; }
      #mandala-preloader .globe-ring:nth-child(3) { animation-delay: 2.6s; }
      @keyframes preloader-globe-expand {
        0%   { width:22%; height:22%; opacity:0.6; }
        100% { width:80%; height:80%; opacity:0; }
      }

      /* Particle canvas */
      #mandala-preloader #overlay {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
      }

      /* Text sheen */
      #mandala-preloader .text-sheen {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 22%;
        z-index: 8;
        pointer-events: none;
        overflow: hidden;
      }
      #mandala-preloader .text-sheen::after {
        content:'';
        position: absolute;
        top:0; left:-100%;
        width: 60%; height: 100%;
        background: linear-gradient(90deg, transparent 0%,
          rgba(255,215,0,0.18) 40%, rgba(255,255,255,0.28) 50%,
          rgba(255,215,0,0.18) 60%, transparent 100%);
        animation: preloader-sheen-sweep 4s ease-in-out 1s infinite;
        transform: skewX(-15deg);
      }
      @keyframes preloader-sheen-sweep {
        0%  { left:-100%; opacity:0; }
        10% { opacity:1; }
        60% { left:140%; }
        100%{ left:140%; opacity:0; }
      }

      /* Outer ambient glow */
      #mandala-preloader .outer-glow {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(212,175,55,0.07) 0%, transparent 70%);
        z-index: 0;
        animation: preloader-outer-pulse 5s ease-in-out infinite;
      }
      @keyframes preloader-outer-pulse {
        0%,100% { opacity:0.5; }
        50%     { opacity:1; }
      }

      #mandala-preloader .no-img-notice {
        position:absolute; inset:0; z-index:20;
        display:none; align-items:center; justify-content:center;
        background:rgba(0,0,0,0.88); color:#D4AF37;
        font-family:Georgia,serif; font-size:1rem;
        text-align:center; padding:2rem; border-radius: 12px;
      }

      #mandala-preloader .preloader-enter-btn {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: rgba(13, 13, 13, 0.6);
        border: 1px solid rgba(255, 199, 44, 0.5);
        color: #FFC72C;
        padding: 12px 28px;
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        font-family: 'Outfit', 'Inter', sans-serif;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        opacity: 0;
        animation: preloader-fade-in-btn 1.5s forwards;
        animation-delay: 1.5s;
        transition: all 0.3s ease;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #mandala-preloader .preloader-enter-btn:hover {
        background: #FFC72C;
        color: #0d0d0d;
        border-color: #FFC72C;
        box-shadow: 0 0 20px rgba(255, 199, 44, 0.4);
      }
      @keyframes preloader-fade-in-btn {
        to { opacity: 1; }
      }
    </style>

    <!-- Preloader Script -->
    <script>
      (function() {
        const wrap = document.getElementById('wrap');
        let preloaderActive = true;

        // ── Resize element canvases to match medallion size ───────────────
        const EL_CONFIGS = [
          { id:'c-akash',   type:'space' },
          { id:'c-vayu',    type:'air' },
          { id:'c-agni',    type:'fire' },
          { id:'c-jal',     type:'water' },
          { id:'c-prithvi', type:'earth' },
        ];

        const elCtxs = {};
        const elState = {};

        function sizeElCanvases() {
          if (!preloaderActive) return;
          const W = wrap.offsetWidth;
          const medallionPx = Math.round(W * 0.16); // approx diameter
          EL_CONFIGS.forEach(cfg => {
            const c = document.getElementById(cfg.id);
            if (!c) return;
            c.width  = medallionPx;
            c.height = medallionPx;
            c.style.width  = medallionPx + 'px';
            c.style.height = medallionPx + 'px';
            elCtxs[cfg.type] = c.getContext('2d');
            if (!elState[cfg.type]) elState[cfg.type] = { t: Math.random()*100 };
          });
        }
        sizeElCanvases();
        window.addEventListener('resize', sizeElCanvases);

        // ── Element draw functions ────────────────────────────────────────
        const TAU = Math.PI * 2;

        function drawSpace(ctx, s, sz) {
          const c = sz/2;
          s.t += 0.008;
          ctx.clearRect(0,0,sz,sz);
          ctx.save();
          ctx.beginPath(); ctx.arc(c,c,c-1,0,TAU); ctx.clip();
          const bg = ctx.createRadialGradient(c,c,0,c,c,c);
          bg.addColorStop(0,'rgba(10,5,30,0.85)'); bg.addColorStop(1,'rgba(0,0,10,0.9)');
          ctx.fillStyle=bg; ctx.fillRect(0,0,sz,sz);
          for (let i=0;i<200;i++){
            const angle = i*0.16 + s.t;
            const dist  = i*0.22;
            const x=c+Math.cos(angle)*dist, y=c+Math.sin(angle)*dist*0.55;
            if(x<0||x>sz||y<0||y>sz) continue;
            const br=1-i/200;
            ctx.beginPath(); ctx.arc(x,y,br*1.5+0.3,0,TAU);
            ctx.fillStyle=`rgba(${150+Math.floor(br*105)},${100+Math.floor(br*80)},255,${br*0.85})`;
            ctx.fill();
          }
          const gc=ctx.createRadialGradient(c,c,0,c,c,sz*0.18);
          gc.addColorStop(0,'rgba(212,175,55,0.9)'); gc.addColorStop(1,'rgba(212,175,55,0)');
          ctx.fillStyle=gc; ctx.beginPath(); ctx.arc(c,c,sz*0.18,0,TAU); ctx.fill();
          ctx.restore();
        }

        function drawAir(ctx, s, sz) {
          const c=sz/2; s.t+=0.014;
          ctx.clearRect(0,0,sz,sz);
          ctx.save(); ctx.beginPath(); ctx.arc(c,c,c-1,0,TAU); ctx.clip();
          const bg=ctx.createRadialGradient(c,c,0,c,c,c);
          bg.addColorStop(0,'rgba(5,20,5,0.8)'); bg.addColorStop(1,'rgba(0,5,0,0.9)');
          ctx.fillStyle=bg; ctx.fillRect(0,0,sz,sz);
          for(let i=0;i<10;i++){
            const angle=(i/10)*TAU + s.t*(1-i*0.03);
            const r=sz*0.08+i*sz*0.04;
            const x=c+Math.cos(angle)*r, y=c+Math.sin(angle)*r*0.7;
            const g=ctx.createRadialGradient(x,y,0,x,y,sz*0.12);
            g.addColorStop(0,`rgba(120,220,80,${0.5-i*0.03})`);
            g.addColorStop(1,'rgba(120,220,80,0)');
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,sz*0.12,0,TAU); ctx.fill();
          }
          ctx.save(); ctx.translate(c,c); ctx.rotate(s.t*0.5);
          for(let i=0;i<8;i++){
            ctx.rotate(TAU/8);
            ctx.strokeStyle=`rgba(180,255,150,0.08)`;
            ctx.lineWidth=1; ctx.beginPath();
            ctx.moveTo(0,0); ctx.lineTo(0,c*0.9); ctx.stroke();
          }
          ctx.restore();
          ctx.restore();
        }

        function drawFire(ctx, s, sz) {
          const c=sz/2; s.t+=0.025;
          ctx.clearRect(0,0,sz,sz);
          ctx.save(); ctx.beginPath(); ctx.arc(c,c,c-1,0,TAU); ctx.clip();
          const bg=ctx.createRadialGradient(c,c,0,c,c,c);
          bg.addColorStop(0,'rgba(30,5,0,0.85)'); bg.addColorStop(1,'rgba(5,0,0,0.95)');
          ctx.fillStyle=bg; ctx.fillRect(0,0,sz,sz);
          for(let i=0;i<25;i++){
            const prog=((s.t*0.9+i*0.4)%1);
            const x=c+Math.sin(i*1.9+s.t)*sz*0.22*prog;
            const y=c+sz*0.25 - prog*sz*0.6;
            const r=(1-prog)*sz*0.1+1;
            const g=ctx.createRadialGradient(x,y,0,x,y,r);
            const heat=Math.floor(200-prog*180);
            g.addColorStop(0,`rgba(255,${heat},0,${1-prog})`);
            g.addColorStop(1,'rgba(200,30,0,0)');
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
          }
          const fc=ctx.createRadialGradient(c,c+sz*0.15,0,c,c+sz*0.15,sz*0.2);
          fc.addColorStop(0,'rgba(255,220,30,0.9)'); fc.addColorStop(1,'rgba(255,80,0,0)');
          ctx.fillStyle=fc; ctx.beginPath(); ctx.arc(c,c+sz*0.15,sz*0.2,0,TAU); ctx.fill();
          ctx.restore();
        }

        function drawWater(ctx, s, sz) {
          const c=sz/2; s.t+=0.018;
          ctx.clearRect(0,0,sz,sz);
          ctx.save(); ctx.beginPath(); ctx.arc(c,c,c-1,0,TAU); ctx.clip();
          const bg=ctx.createRadialGradient(c,c,0,c,c,c);
          bg.addColorStop(0,'rgba(0,15,40,0.85)'); bg.addColorStop(1,'rgba(0,3,15,0.95)');
          ctx.fillStyle=bg; ctx.fillRect(0,0,sz,sz);
          for(let w=0;w<6;w++){
            ctx.beginPath();
            const yBase=sz*(0.25+w*0.12);
            for(let x=0;x<=sz;x+=2){
              const y=yBase+Math.sin((x/sz)*Math.PI*3+s.t+w*0.9)*sz*0.07;
              x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            }
            ctx.lineTo(sz,sz); ctx.lineTo(0,sz); ctx.closePath();
            ctx.fillStyle=`rgba(20,80,200,${0.15-w*0.015})`;
            ctx.fill();
            ctx.beginPath();
            for(let x=0;x<=sz;x+=2){
              const y=yBase+Math.sin((x/sz)*Math.PI*3+s.t+w*0.9)*sz*0.07;
              x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            }
            ctx.strokeStyle=`rgba(80,160,255,${0.5-w*0.06})`; ctx.lineWidth=1.2; ctx.stroke();
          }
          const sc=ctx.createRadialGradient(c,c*0.6,0,c,c*0.6,sz*0.4);
          sc.addColorStop(0,'rgba(150,220,255,0.12)'); sc.addColorStop(1,'rgba(0,50,150,0)');
          ctx.fillStyle=sc; ctx.fillRect(0,0,sz,sz);
          ctx.restore();
        }

        function drawEarth(ctx, s, sz) {
          const c=sz/2; s.t+=0.01;
          ctx.clearRect(0,0,sz,sz);
          ctx.save(); ctx.beginPath(); ctx.arc(c,c,c-1,0,TAU); ctx.clip();
          const bg=ctx.createRadialGradient(c,c,0,c,c,c);
          bg.addColorStop(0,'rgba(5,20,0,0.85)'); bg.addColorStop(1,'rgba(0,5,0,0.95)');
          ctx.fillStyle=bg; ctx.fillRect(0,0,sz,sz);
          ctx.save(); ctx.translate(c,c); ctx.rotate(s.t*0.3);
          for(let r=1;r<=4;r++){
            ctx.beginPath(); ctx.arc(0,0,sz*r*0.15,0,TAU);
            ctx.strokeStyle=`rgba(60,${140+r*15},30,${0.3-r*0.04})`; ctx.lineWidth=1; ctx.stroke();
          }
          ctx.restore();
          ctx.fillStyle='rgba(120,70,20,0.7)';
          ctx.fillRect(c-2,c-sz*0.05,4,sz*0.3);
          for(let b=0;b<14;b++){
            const ang=(b/14)*TAU+s.t*0.4;
            const r=sz*0.12+b*sz*0.015;
            const x=c+Math.cos(ang)*r*0.9, y=(c-sz*0.05)+Math.sin(ang)*r*0.6;
            ctx.beginPath(); ctx.arc(x,y,sz*0.055,0,TAU);
            ctx.fillStyle=`rgba(40,${130+b*5},20,0.65)`; ctx.fill();
          }
          const gc=ctx.createLinearGradient(0,c+sz*0.15,0,sz);
          gc.addColorStop(0,'rgba(60,40,5,0.3)'); gc.addColorStop(1,'rgba(20,10,0,0)');
          ctx.fillStyle=gc; ctx.fillRect(0,c+sz*0.15,sz,sz);
          ctx.restore();
        }

        const DRAW_FNS = { space:drawSpace, air:drawAir, fire:drawFire, water:drawWater, earth:drawEarth };

        // ── Particle overlay canvas ───────────────────────────────────────
        const overlay = document.getElementById('overlay');
        const octx    = overlay.getContext('2d');

        function resizeOverlay() {
          if (!preloaderActive) return;
          overlay.width  = wrap.offsetWidth;
          overlay.height = wrap.offsetHeight;
        }
        resizeOverlay();
        window.addEventListener('resize', () => { resizeOverlay(); sizeElCanvases(); });

        const medallions=[
          {fx:0.50,fy:0.10},{fx:0.13,fy:0.36},{fx:0.87,fy:0.36},
          {fx:0.13,fy:0.63},{fx:0.87,fy:0.63},{fx:0.50,fy:0.47},
        ];
        const particles=[];
        for(let i=0;i<80;i++){
          const m=medallions[Math.floor(Math.random()*medallions.length)];
          const ang=Math.random()*TAU, sp=Math.random()*0.4+0.1;
          particles.push({fx:m.fx,fy:m.fy,x:0,y:0,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
            life:Math.random(),maxLife:Math.random()*0.6+0.4,size:Math.random()*2.5+0.5,gold:Math.random()<0.7});
        }
        particles.forEach(p=>{ p.x=p.fx*wrap.offsetWidth+(Math.random()-.5)*30; p.y=p.fy*wrap.offsetHeight+(Math.random()-.5)*30; });

        let orbitAngle=0;

        let lastWrapW = 0;
        let lastWrapH = 0;

        // ── Main animation loop ───────────────────────────────────────────
        function loop(){
          if (!preloaderActive) return;

          const curW = wrap.offsetWidth;
          const curH = wrap.offsetHeight;
          if (curW > 0 && (curW !== lastWrapW || curH !== lastWrapH)) {
            lastWrapW = curW;
            lastWrapH = curH;
            sizeElCanvases();
            resizeOverlay();
          }

          const sz = Math.round(curW * 0.16);
          if (sz <= 0) {
            requestAnimationFrame(loop);
            return;
          }

          EL_CONFIGS.forEach(cfg=>{
            const ctx=elCtxs[cfg.type];
            if(ctx) DRAW_FNS[cfg.type](ctx, elState[cfg.type], sz);
          });

          const OW=overlay.width, OH=overlay.height;
          octx.clearRect(0,0,OW,OH);

          orbitAngle+=0.008;
          const cx=OW*0.5, cy=OH*0.47, orbitR=OW*0.38;
          octx.beginPath(); octx.arc(cx,cy,orbitR,0,TAU);
          octx.strokeStyle='rgba(212,175,55,0.07)'; octx.lineWidth=1; octx.stroke();
          const dotX=cx+Math.cos(orbitAngle)*orbitR;
          const dotY=cy+Math.sin(orbitAngle)*orbitR*0.68;
          const dg=octx.createRadialGradient(dotX,dotY,0,dotX,dotY,7);
          dg.addColorStop(0,'rgba(255,215,0,1)'); dg.addColorStop(1,'rgba(255,215,0,0)');
          octx.fillStyle=dg; octx.beginPath(); octx.arc(dotX,dotY,7,0,TAU); octx.fill();

          particles.forEach(p=>{
            p.x+=p.vx; p.y+=p.vy; p.life+=0.004;
            if(p.life>p.maxLife){
              const m=medallions[Math.floor(Math.random()*medallions.length)];
              const ang=Math.random()*TAU, sp=Math.random()*0.4+0.1;
              p.fx=m.fx; p.fy=m.fy;
              p.x=m.fx*OW+(Math.random()-.5)*30; p.y=m.fy*OH+(Math.random()-.5)*30;
              p.vx=Math.cos(ang)*sp; p.vy=Math.sin(ang)*sp;
              p.life=0; p.maxLife=Math.random()*0.6+0.4; p.size=Math.random()*2.5+0.5; return;
            }
            const prog=p.life/p.maxLife;
            const alpha=prog<0.2?prog/0.2:1-(prog-0.2)/0.8;
            octx.beginPath(); octx.arc(p.x,p.y,p.size,0,TAU);
            octx.fillStyle=p.gold?`rgba(212,175,55,${alpha*0.85})`:`rgba(255,255,255,${alpha*0.4})`;
            octx.fill();
          });

          const t=Date.now()/1000;
          const ga=0.07+Math.sin(t*0.8)*0.035;
          const sg=octx.createRadialGradient(cx,cy,0,cx,cy,OW*0.2);
          sg.addColorStop(0,`rgba(212,175,55,${ga})`); sg.addColorStop(1,'rgba(212,175,55,0)');
          octx.fillStyle=sg; octx.fillRect(0,0,OW,OH);

          requestAnimationFrame(loop);
        }
        loop();

        // ── Transition out / Enter Site function ──────────────────────────
        window.enterSite = function() {
          const preloader = document.getElementById('mandala-preloader');
          if (preloader && preloaderActive) {
            preloaderActive = false;
            preloader.classList.add('fade-out');
            document.body.style.overflow = '';
            setTimeout(() => {
              preloader.remove();
            }, 1000);
          }
        };

        // Auto-enter after 2.5 seconds to showcase the animation
        setTimeout(window.enterSite, 2500);
      })();
    </script>
  </body>
</html>
