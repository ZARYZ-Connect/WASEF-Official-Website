    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap');

      body {
        margin: 0;

      }

      /* â”€â”€ Video preloader â”€â”€ */
      #video-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #ececec;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #video-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #video-preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @media (max-width: 767px) {
        #video-preloader video {
          object-fit: contain;
        }
      }

      /* Skip button */
      #video-preloader .vp-skip {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        z-index: 10;
        background: rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(0, 0, 0, 0.15);
        color: #1e293b;
        font-family: 'Outfit', 'Inter', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.5rem 1.2rem;
        border-radius: 100px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        animation: vp-skip-in 0.4s ease 1s forwards;
        transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
      }
      #video-preloader .vp-skip:hover {
        background: rgba(0, 0, 0, 0.1);
        border-color: rgba(0, 0, 0, 0.3);
        color: #000000;
        transform: translateY(-1px);
      }
      @keyframes vp-skip-in { to { opacity: 1; } }
    </style>

  <body style="background: #ececec; overflow: hidden;">
    <!-- Video intro preloader -->
    <div id="video-preloader">
      <video
        id="vp-video"
        src="/loading-video.mp4"
        muted
        playsinline
        preload="auto"
        autoplay
      ></video>
      <button class="vp-skip" onclick="vpDismiss()">Skip â€º</button>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Video preloader dismiss script -->
    <script>
      (function () {
        var dismissed = false;

        function vpDismiss() {
          if (dismissed) return;
          dismissed = true;
          var el = document.getElementById('video-preloader');
          if (el) {
            el.classList.add('fade-out');
            document.body.style.background = '';
            document.body.style.overflow = '';
            setTimeout(function () { el.remove(); }, 850);
          }
        }

        // Expose for inline onclick
        window.vpDismiss = vpDismiss;

        var video = document.getElementById('vp-video');
        if (video) {
          video.addEventListener('ended', vpDismiss);
          // Fallback: if video fails to load/play, dismiss after 3 s
          video.addEventListener('error', function () {
            setTimeout(vpDismiss, 3000);
          });
          video.play().catch(function () {
            // Autoplay blocked â€” dismiss immediately so site isn't stuck
            vpDismiss();
          });
        }
      })();
    </script>
  </body>
