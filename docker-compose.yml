services:

  # ── Django Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wasef_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - wasef_net

  # ── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api   # relative path — Nginx proxies it
    container_name: wasef_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wasef_net

# ── Persistent volumes ───────────────────────────────────────────
volumes:
  media_data:
    driver: local
  static_data:
    driver: local

# ── Internal network ─────────────────────────────────────────────
networks:
  wasef_net:
    driver: bridge
